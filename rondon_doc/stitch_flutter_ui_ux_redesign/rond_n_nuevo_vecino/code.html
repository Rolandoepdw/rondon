<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo Vecino - RONDÓN</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-dim": "#061423",
                      "on-secondary-fixed-variant": "#014395",
                      "on-primary-fixed": "#001a42",
                      "secondary": "#aec6ff",
                      "surface-bright": "#2d3a4b",
                      "surface-container-highest": "#283646",
                      "on-error": "#690005",
                      "on-tertiary": "#002e6a",
                      "secondary-fixed": "#d8e2ff",
                      "tertiary-fixed": "#d8e2ff",
                      "on-primary-fixed-variant": "#014395",
                      "on-tertiary-fixed-variant": "#014395",
                      "error-container": "#93000a",
                      "on-background": "#d5e4f9",
                      "tertiary": "#aec6ff",
                      "surface-variant": "#283646",
                      "outline-variant": "#434751",
                      "error": "#ffb4ab",
                      "on-error-container": "#ffdad6",
                      "on-surface-variant": "#c3c6d3",
                      "primary-fixed-dim": "#aec6ff",
                      "on-secondary-container": "#97b8ff",
                      "surface-container": "#132030",
                      "on-primary-container": "#91b4ff",
                      "surface-container-high": "#1d2b3b",
                      "tertiary-container": "#004395",
                      "tertiary-fixed-dim": "#aec6ff",
                      "outline": "#8d909d",
                      "on-primary": "#002e6a",
                      "primary-container": "#004395",
                      "on-secondary": "#002e6a",
                      "inverse-primary": "#2b5caf",
                      "primary": "#aec6ff",
                      "secondary-fixed-dim": "#aec6ff",
                      "on-surface": "#d5e4f9",
                      "inverse-on-surface": "#243142",
                      "surface": "#061423",
                      "on-secondary-fixed": "#001a42",
                      "surface-tint": "#aec6ff",
                      "secondary-container": "#074698",
                      "surface-container-lowest": "#020f1e",
                      "on-tertiary-fixed": "#001a42",
                      "primary-fixed": "#d8e2ff",
                      "surface-container-low": "#0e1c2c",
                      "on-tertiary-container": "#91b4ff",
                      "inverse-surface": "#d5e4f9",
                      "background": "#061423"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Inter"
                      ],
                      "display": [
                              "Inter"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              },
              "fontSize": {}
      },
          },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-radio:checked + label {
            background-color: #004395;
            color: #d5e4f9;
            border-color: #004395;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar (from JSON specs + intent modifications) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface bg-surface-container-low dark:bg-surface-container-low flex justify-between items-center px-4 h-16 w-full shadow-none">
<button class="text-primary dark:text-primary hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors active:opacity-80 transition-opacity p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-headline-lg-mobile font-semibold tracking-tight text-on-surface dark:text-on-surface flex-1 text-center">Nuevo Vecino</h1>
<div class="w-10"></div> <!-- Placeholder to balance layout -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-20 px-4 pb-24 md:max-w-2xl md:mx-auto md:w-full space-y-6">
<!-- Form Section -->
<form class="space-y-6">
<!-- Full Name Input -->
<div class="space-y-2">
<label class="block font-label text-[12px] font-bold tracking-[0.05em] text-on-surface-variant" for="fullName">Nombre Completo</label>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="fullName" name="fullName" placeholder="Ej. Juan Pérez" type="text"/>
</div>
<!-- Phone Input -->
<div class="space-y-2">
<label class="block font-label text-[12px] font-bold tracking-[0.05em] text-on-surface-variant" for="phone">Teléfono (WhatsApp)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="phone">phone</span>
</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg pl-10 pr-4 py-3 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="phone" name="phone" placeholder="+58 412 1234567" type="tel"/>
</div>
</div>
<!-- Gender Selector (Segmented) -->
<div class="space-y-2">
<label class="block font-label text-[12px] font-bold tracking-[0.05em] text-on-surface-variant">Género</label>
<div class="flex gap-2">
<div class="flex-1">
<input class="hidden custom-radio" id="genderMale" name="gender" type="radio" value="masculino"/>
<label class="flex items-center justify-center w-full py-3 border border-outline-variant rounded-lg cursor-pointer text-on-surface-variant hover:bg-surface-container-high transition-colors font-body text-body-sm" for="genderMale">
<span class="material-symbols-outlined mr-2 text-sm" data-icon="man">man</span> Masculino
                        </label>
</div>
<div class="flex-1">
<input class="hidden custom-radio" id="genderFemale" name="gender" type="radio" value="femenino"/>
<label class="flex items-center justify-center w-full py-3 border border-outline-variant rounded-lg cursor-pointer text-on-surface-variant hover:bg-surface-container-high transition-colors font-body text-body-sm" for="genderFemale">
<span class="material-symbols-outlined mr-2 text-sm" data-icon="woman">woman</span> Femenino
                        </label>
</div>
</div>
</div>
<!-- Operational Profile Selector (Segmented) -->
<div class="space-y-2">
<label class="block font-label text-[12px] font-bold tracking-[0.05em] text-on-surface-variant">Perfil Operativo</label>
<div class="flex gap-2">
<div class="flex-1">
<input checked="" class="hidden custom-radio" id="profileActive" name="profile" type="radio" value="activo"/>
<label class="flex items-center justify-center w-full py-3 border border-outline-variant rounded-lg cursor-pointer text-on-surface-variant hover:bg-surface-container-high transition-colors font-label text-[12px] font-bold tracking-[0.05em]" for="profileActive">
<span class="material-symbols-outlined mr-2 text-sm" data-icon="local_police">local_police</span> ACTIVO
                        </label>
</div>
<div class="flex-1">
<input class="hidden custom-radio" id="profileSupport" name="profile" type="radio" value="apoyo"/>
<label class="flex items-center justify-center w-full py-3 border border-outline-variant rounded-lg cursor-pointer text-on-surface-variant hover:bg-surface-container-high transition-colors font-label text-[12px] font-bold tracking-[0.05em]" for="profileSupport">
<span class="material-symbols-outlined mr-2 text-sm" data-icon="handshake">handshake</span> APOYO
                        </label>
</div>
</div>
</div>
<!-- Notes -->
<div class="space-y-2">
<label class="block font-label text-[12px] font-bold tracking-[0.05em] text-on-surface-variant" for="notes">Notas Adicionales</label>
<textarea class="w-full bg-surface-container border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="notes" name="notes" placeholder="Información relevante sobre el vecino..." rows="4"></textarea>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface-container-lowest border-t border-outline-variant/30 md:relative md:bg-transparent md:border-none md:p-0 md:mt-4 md:max-w-2xl md:mx-auto z-40 pb-safe">
<button class="w-full bg-primary-container text-on-background font-body text-body-lg font-semibold py-4 rounded-lg flex items-center justify-center hover:bg-primary-container/90 active:scale-[0.98] transition-all shadow-lg" type="button">
<span class="material-symbols-outlined mr-2" data-icon="save">save</span> Guardar Vecino
        </button>
</div>
</body></html>
