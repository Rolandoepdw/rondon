<!DOCTYPE html><html class="dark" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Nueva Plantilla - Rondón</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed-variant": "#014395",
                      "secondary-fixed": "#d8e2ff",
                      "surface-tint": "#aec6ff",
                      "primary-fixed": "#d8e2ff",
                      "surface-container-high": "#1d2b3b",
                      "surface-container": "#132030",
                      "on-background": "#d5e4f9",
                      "error-container": "#93000a",
                      "secondary-fixed-dim": "#aec6ff",
                      "tertiary": "#aec6ff",
                      "on-tertiary-fixed": "#001a42",
                      "surface-dim": "#061423",
                      "outline-variant": "#434751",
                      "surface-container-highest": "#283646",
                      "secondary": "#aec6ff",
                      "on-secondary-container": "#97b8ff",
                      "error": "#ffb4ab",
                      "surface": "#061423",
                      "on-surface-variant": "#c3c6d3",
                      "on-secondary": "#002e6a",
                      "on-primary-container": "#91b4ff",
                      "secondary-container": "#074698",
                      "on-primary-fixed": "#001a42",
                      "surface-variant": "#283646",
                      "surface-container-lowest": "#020f1e",
                      "on-primary-fixed-variant": "#014395",
                      "outline": "#8d909d",
                      "on-surface": "#d5e4f9",
                      "inverse-primary": "#2b5caf",
                      "on-secondary-fixed-variant": "#014395",
                      "inverse-surface": "#d5e4f9",
                      "on-secondary-fixed": "#001a42",
                      "background": "#061423",
                      "surface-container-low": "#0e1c2c",
                      "on-error": "#690005",
                      "on-error-container": "#ffdad6",
                      "on-primary": "#002e6a",
                      "surface-bright": "#2d3a4b",
                      "on-tertiary-container": "#91b4ff",
                      "tertiary-container": "#004395",
                      "tertiary-fixed": "#d8e2ff",
                      "primary-container": "#004395",
                      "primary-fixed-dim": "#aec6ff",
                      "primary": "#aec6ff",
                      "inverse-on-surface": "#243142",
                      "tertiary-fixed-dim": "#aec6ff",
                      "on-tertiary": "#002e6a"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Inter"
                      ],
                      "display": [
                              "Inter"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        body {
            background-color: #000b1a; /* Base Level 0 */
            color: theme('colors.on-surface');
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background-color: #001a3d; /* Surface Level 1 */
            border: 1px solid theme('colors.outline-variant');
        }
        /* Custom Input Styles */
        input[type="text"],
        input[type="time"],
        input[type="number"] {
            background-color: #001a3d;
            border: 1px solid theme('colors.primary');
            color: theme('colors.on-surface');
        }
        input[type="text"]:focus,
        input[type="time"]:focus,
        input[type="number"]:focus {
            box-shadow: 0 0 0 2px theme('colors.primary');
            border-color: theme('colors.primary');
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface flex justify-between items-center w-full px-4 h-16 docked full-width top-0 bg-surface-container-low dark:bg-surface-container-low flat no shadows">
<button class="text-primary dark:text-primary active:scale-95 duration-150 p-2 rounded-full hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline font-semibold text-headline-lg text-primary dark:text-primary">Nueva Plantilla</h1>
<button class="text-primary dark:text-primary active:scale-95 duration-150 p-2 rounded-full hover:bg-surface-container-highest transition-colors">

</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-4 overflow-y-auto w-full max-w-3xl mx-auto space-y-6 pb-24">
<!-- Detalles del Turno Section -->
<section class="rounded-lg p-6 space-y-6 bg-surface-container">
<h2 class="text-xl font-headline font-semibold text-primary mb-4 flex items-center gap-2 border-b border-outline-variant pb-2">
<span class="material-symbols-outlined text-primary">description</span>
                Detalles del Turno
            </h2>
<!-- Nombre de la Plantilla -->
<div class="space-y-2">
<label class="block font-label font-bold text-label-caps text-on-surface-variant" for="template-name">Nombre de la Plantilla</label>
<input class="w-full rounded-md px-4 py-3 text-sm transition-all text-on-surface" id="template-name" placeholder="Ej: Turno Madrugada" type="text">
</div>
<!-- Horario (Lado a lado) -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block font-label font-bold text-label-caps text-on-surface-variant" for="start-time">Hora de Inicio</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">schedule</span>
<input class="w-full rounded-md pl-10 pr-4 py-3 text-sm transition-all text-on-surface" id="start-time" type="time" value="06:00">
</div>
</div>
<div class="space-y-2">
<label class="block font-label font-bold text-label-caps text-on-surface-variant" for="end-time">Hora de Fin</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">schedule</span>
<input class="w-full rounded-md pl-10 pr-4 py-3 text-sm transition-all text-on-surface" id="end-time" type="time" value="14:00">
</div>
</div>
</div>
<!-- Género Permitido -->
<div class="space-y-2">
<label class="block font-label font-bold text-label-caps text-on-surface-variant">Género Permitido</label>
<div class="flex rounded-md overflow-hidden border border-primary divide-x divide-primary">
<button class="flex-1 py-3 text-sm font-semibold bg-primary-container text-on-primary-container transition-colors">Hombres
                    </button>
<button class="flex-1 py-3 text-sm font-semibold bg-surface-container-low hover:bg-surface-container text-on-surface transition-colors">Mujeres
                    </button>
<button class="flex-1 py-3 text-sm font-semibold bg-surface-container-low hover:bg-surface-container text-on-surface transition-colors">
                        Mixto
                    </button>
</div>
</div>
<!-- Requisitos Numéricos -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block font-label font-bold text-label-caps text-on-surface-variant" for="target-quota">Cupo Objetivo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">groups</span>
<input class="w-full rounded-md pl-10 pr-4 py-3 text-sm transition-all font-display text-lg text-on-surface" id="target-quota" min="1" placeholder="0" type="number">
</div>
</div>
<div class="space-y-2">
<label class="block font-label font-bold text-label-caps text-on-surface-variant" for="active-profiles">Perfiles Activos Mín.</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">verified_user</span>
<input class="w-full rounded-md pl-10 pr-4 py-3 text-sm transition-all font-display text-lg text-on-surface" id="active-profiles" min="0" placeholder="0" type="number">
</div>
</div>
</div>
<div class="bg-surface-container-highest p-4 rounded-md border border-outline-variant mt-4 flex gap-3 items-start">
<span class="material-symbols-outlined text-primary mt-0.5">info</span>
<p class="text-xs text-on-surface-variant font-body">La regla 2 del dominio requiere establecer un mínimo de participantes con perfil ACTIVO para garantizar la cobertura base.</p>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full z-50 bg-[#000b1a] border-t border-outline-variant p-4 flex justify-center">
<button class="w-full max-w-3xl bg-primary-container hover:bg-[#0052b3] text-white font-headline font-semibold py-4 rounded-lg transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
            Guardar Plantilla
        </button>
</div>
<!-- No Navigation Shells included as this is a transactional creation flow with a back button. -->


</body></html>
